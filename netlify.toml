# Netlify configuration for Secure Code Classroom
# -----------------------------------------------------------------------------
# This is a static HTML/CSS/JS site (no framework/bundler). The "build" step
# just runs build.js, a small Node script that writes assets/js/config.js
# from the SUPABASE_URL and SUPABASE_ANON_KEY environment variables you set
# in Netlify's dashboard (Site configuration > Environment variables).
# -----------------------------------------------------------------------------

[build]
  command = "node build.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"
  # assets/js/config.js legitimately contains SUPABASE_URL/SUPABASE_ANON_KEY
  # (they're meant to be public — real protection is the RLS policies in
  # sql/schema.sql). Tell Netlify's secret scanner not to flag it.
  SECRETS_SCAN_OMIT_PATHS = "assets/js/config.js,assets/js/config.sample.js"

# Security headers -----------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Never cache the generated config file so credential rotations take effect
# immediately after a redeploy.
[[headers]]
  for = "/assets/js/config.js"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
