<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Code Classroom — Sign In</title>
  <meta name="description" content="Sign in to Secure Code Classroom to view or manage programming code.">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- App styles -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card fade-in-up">
      <div class="text-center mb-4">
        <div class="brand-mark justify-content-center">
          <span class="bracket">&lt;/&gt;</span> Secure Code Classroom
        </div>
        <p class="auth-subtitle mt-2 mb-0">Sign in to view or manage classroom code.</p>
      </div>

      <div id="loginAlert" class="form-alert error"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@school.edu" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="loginBtn" class="btn btn-teal w-100 py-2 mt-2">Sign in</button>
      </form>

      <div class="divider-label">new here</div>

      <a href="register.html" class="btn btn-outline-teal w-100 py-2">Create a student account</a>

      <p class="text-center text-muted-2 mt-4 mb-0" style="font-size: 0.78rem;">
        <i class="bi bi-shield-check me-1"></i>
        Administrator access is limited to one predefined account.
      </p>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit);
    redirectIfAlreadyLoggedIn();
  </script>
</body>
</html>
