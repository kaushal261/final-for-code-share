<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Code Classroom — Student Registration</title>
  <meta name="description" content="Create a student account for Secure Code Classroom.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card fade-in-up">
      <div class="text-center mb-4">
        <div class="brand-mark justify-content-center">
          <span class="bracket">&lt;/&gt;</span> Secure Code Classroom
        </div>
        <p class="auth-subtitle mt-2 mb-0">Create a student account to view classroom code.</p>
      </div>

      <div id="registerAlert" class="form-alert error"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="regFullName">Full name</label>
          <input type="text" class="form-control" id="regFullName" placeholder="Jordan Lee" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="regEmail">Email</label>
          <input type="email" class="form-control" id="regEmail" placeholder="you@school.edu" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="regPassword">Password</label>
          <input type="password" class="form-control" id="regPassword" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label" for="regConfirmPassword">Confirm password</label>
          <input type="password" class="form-control" id="regConfirmPassword" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" id="registerBtn" class="btn btn-teal w-100 py-2 mt-2">Create account</button>
      </form>

      <div class="divider-label">already registered</div>

      <a href="index.html" class="btn btn-outline-teal w-100 py-2">Back to sign in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', handleRegisterSubmit);
    redirectIfAlreadyLoggedIn();
  </script>
</body>
</html>
